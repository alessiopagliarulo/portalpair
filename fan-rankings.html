<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overall Rankings — Portal Pair</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/mascot.svg" alt="" class="mascot">Portal<span>Pair</span></a>
      <nav class="nav-auth">
        <a href="fan-rankings.html" class="btn btn-ghost">Overall Rankings</a>
        <a href="dashboard.html" class="btn btn-ghost">Portal</a>
        <a href="login.html" class="btn btn-primary">Login / Sign up</a>
      </nav>
    </div>
  </header>

  <main class="results-section rankings-centered" style="padding-top: 2rem;">
    <div class="rankings-title-row">
      <h1 class="section-title" style="margin-bottom: 0; margin-right: 0.5rem;">Overall Rankings</h1>
      <a href="how-we-calculate.html" class="info-btn" aria-label="How we calculate">
        <span class="info-btn-icon">?</span>
        <span class="info-btn-tooltip">Find Out How We Calculate This</span>
      </a>
    </div>
    <p class="section-subtitle" style="margin-bottom: 1.5rem;">ESPN Top 100 players, 2025 season. Rank 1 is the best. No account needed.</p>

    <div id="rankingsHeader" class="results-header">
      <h2>Top 100 — Overall ranking</h2>
      <p id="rankingsCount" class="results-count"></p>
    </div>
    <div id="loading" class="loading" style="display: none;">Loading rankings…</div>
    <div id="rankingsGrid" class="results-grid results-grid-wide"></div>
  </main>

  <footer class="footer">
    <p>Portal Pair — Overall Rankings · No login required · <a href="index.html" style="color: var(--accent);">Back to home</a></p>
  </footer>

  <script>
    (function () {
      var grid = document.getElementById('rankingsGrid');
      var countEl = document.getElementById('rankingsCount');
      var loading = document.getElementById('loading');

      function escapeHtml(s) {
        if (!s) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function render(players) {
        grid.innerHTML = '';
        countEl.textContent = players.length + ' players';
        players.forEach(function (p) {
          var card = document.createElement('div');
          card.className = 'player-card';
          card.className = 'player-card player-card-row';
          card.innerHTML =
            '<span class="player-card-rank">#' + escapeHtml(String(p.rank)) + '</span>' +
            '<span class="player-card-ring"><span>0</span></span>' +
            '<span class="player-card-name">' + escapeHtml(p.name) + '</span>' +
            (p.stats ? '<span class="player-card-stats">' + escapeHtml(p.stats) + '</span>' : '');
          grid.appendChild(card);
        });
      }

      function parseCsvFallback(text) {
        var lines = text.trim().split('\n');
        if (lines.length < 2) return [];
        var out = [];
        for (var i = 1; i < lines.length; i++) {
          var line = lines[i];
          var firstComma = line.indexOf(',');
          var secondComma = line.indexOf(',', firstComma + 1);
          if (firstComma === -1 || secondComma === -1) continue;
          var rank = parseInt(line.slice(0, firstComma), 10);
          var name = line.slice(firstComma + 1, secondComma).trim();
          var stats = line.slice(secondComma + 1).trim();
          if (stats.startsWith('"') && stats.endsWith('"')) stats = stats.slice(1, -1);
          out.push({ rank: isNaN(rank) ? i : rank, name: name, stats: stats });
        }
        out.sort(function (a, b) { return a.rank - b.rank; });
        return out;
      }

      loading.style.display = 'block';
      fetch('/api/rankings')
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          if (Array.isArray(data) && data.length > 0) {
            loading.style.display = 'none';
            render(data);
            return;
          }
          return fetch('data/espn_cfb_top100_players_2025_season.csv')
            .then(function (r) { return r.text(); })
            .then(function (text) {
              var parsed = parseCsvFallback(text);
              loading.style.display = 'none';
              if (parsed.length > 0) {
                render(parsed);
              } else {
                countEl.textContent = 'No rankings loaded.';
              }
            });
        })
        .then(function () { if (loading.style.display !== 'none') loading.style.display = 'none'; })
        .catch(function () {
          fetch('data/espn_cfb_top100_players_2025_season.csv')
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (text) {
              loading.style.display = 'none';
              var parsed = text ? parseCsvFallback(text) : [];
              if (parsed.length > 0) {
                render(parsed);
              } else {
                countEl.textContent = 'Rankings cannot be loaded. Start the server with: node server.js';
              }
            })
            .catch(function () {
              loading.style.display = 'none';
              countEl.textContent = 'Rankings cannot be loaded. Start the server with: node server.js';
            });
        });
    })();
  </script>
</body>
</html>
