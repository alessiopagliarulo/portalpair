<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile — Portal Pair</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/player-profile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="profile-page">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/mascot.svg" alt="" class="mascot">Portal<span>Pair</span></a>
      <nav class="nav-auth">
        <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
        <a href="fan-rankings.html" class="btn btn-ghost">Overall Ranking</a>
        <a href="index.html" class="btn btn-ghost">Home</a>
      </nav>
    </div>
  </header>

  <main class="profile-main">
    <div id="profileLoading" class="profile-loading">Loading profile…</div>
    <div id="profileError" class="profile-error hidden"></div>
    <div id="profileContent" class="profile-content hidden">
      <div class="profile-header">
        <h1 id="profileName" class="profile-name"></h1>
        <div class="profile-meta" id="profileMeta"></div>
      </div>
      <section class="biometric-section" id="biometricSection">
        <div class="biometric-grid">
          <div class="biometric-card"><span class="biometric-label">Height</span><span class="biometric-value" id="bioHeight">—</span></div>
          <div class="biometric-card"><span class="biometric-label">Weight</span><span class="biometric-value" id="bioWeight">—</span></div>
          <div class="biometric-card"><span class="biometric-label">Jersey</span><span class="biometric-value" id="bioJersey">—</span></div>
          <div class="biometric-card"><span class="biometric-label">Hometown</span><span class="biometric-value" id="bioHometown">—</span></div>
        </div>
      </section>
      <div class="profile-grid">
        <section class="profile-section">
          <h2>Profile</h2>
          <dl id="profileFields" class="profile-fields"></dl>
        </section>
        <section class="profile-section">
          <h2>Play involvement</h2>
          <div class="chart-container">
            <canvas id="usageBarChart"></canvas>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer footer-minimal">
    <p>Portal Pair · College Football Data API</p>
  </footer>

  <script src="js/player-profile.js"></script>
</body>
</html>
