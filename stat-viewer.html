<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stat Viewer — Portal Pair</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stat-viewer-page { min-height: 100vh; display: flex; flex-direction: column; }
    .stat-viewer-main { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; padding: 2rem; }
    .stat-viewer-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
    .player-select-bar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 2rem; }
    .player-select-bar input { flex: 1; padding: 0.85rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; }
    .player-select-bar input:focus { outline: none; border-color: var(--accent); }
    .player-select-bar input[readonly] { background: var(--bg-elevated); cursor: default; }
    .view-stats-btn { display: inline-block; margin-top: 0.75rem; padding: 0.5rem 1rem; background: var(--accent); color: white; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; text-decoration: none; transition: background 0.2s; }
    .view-stats-btn:hover { background: var(--accent-dim); color: white; }
    .chart-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; min-height: 280px; }
    .chart-container canvas { max-height: 260px; }
    .stat-viewer-loading { color: var(--text-muted); padding: 2rem; text-align: center; }
    .stat-viewer-error { color: var(--danger); padding: 1rem; background: #ffebee; border-radius: var(--radius); margin-bottom: 1rem; }
    .stat-viewer-empty { color: var(--text-muted); padding: 2rem; text-align: center; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }
    .stat-select-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .stat-select-label { font-size: 0.95rem; font-weight: 600; }
    .stat-select { padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.95rem; background: var(--bg-card); cursor: pointer; min-width: 200px; }
    .stat-select:focus { outline: none; border-color: var(--accent); }
    .biodata-section { margin-bottom: 1.5rem; }
    .biodata-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    .biodata-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
    .biodata-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
    .biodata-value { font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body class="stat-viewer-page dashboard-page">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/mascot.svg" alt="" class="mascot">Portal<span>Pair</span></a>
      <nav class="nav-dashboard">
        <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
        <a href="my-players.html" class="btn btn-ghost">My Players</a>
        <a href="fan-rankings.html" class="btn btn-ghost">Overall Ranking</a>
      </nav>
    </div>
  </header>

  <main class="stat-viewer-main">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    <h1 class="stat-viewer-title">Stat Viewer</h1>

    <div class="player-select-bar">
      <input type="text" id="playerInput" placeholder="Enter player name (e.g. Tyler Little)">
      <input type="text" id="teamInput" placeholder="Team (optional)">
    </div>

    <div id="errorEl" class="stat-viewer-error hidden"></div>
    <div id="loadingEl" class="stat-viewer-loading hidden">Loading...</div>
    <div id="emptyEl" class="stat-viewer-empty hidden">No player selected. Go to the Dashboard and click View Stats on a match.</div>

    <div id="biodataArea" class="biodata-section hidden">
      <div class="biodata-grid">
        <div class="biodata-card" id="bioRatingCard" style="display:none;"><span class="biodata-label">Overall Rating</span><span class="biodata-value" id="bioRating">—</span></div>
        <div class="biodata-card"><span class="biodata-label">Position</span><span class="biodata-value" id="bioPosition">—</span></div>
        <div class="biodata-card" id="bioClassCard" style="display:none;"><span class="biodata-label">Class</span><span class="biodata-value" id="bioClass">—</span></div>
        <div class="biodata-card"><span class="biodata-label">Height</span><span class="biodata-value" id="bioHeight">—</span></div>
        <div class="biodata-card"><span class="biodata-label">Weight</span><span class="biodata-value" id="bioWeight">—</span></div>
        <div class="biodata-card"><span class="biodata-label">Jersey</span><span class="biodata-value" id="bioJersey">—</span></div>
        <div class="biodata-card"><span class="biodata-label">Hometown</span><span class="biodata-value" id="bioHometown">—</span></div>
      </div>
    </div>

    <div id="chartsArea" class="hidden">
      <div class="stat-select-row">
        <label for="statSelect" class="stat-select-label">Select stat:</label>
        <select id="statSelect" class="stat-select"></select>
      </div>
      <div class="chart-container">
        <canvas id="statChart"></canvas>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/stat-viewer.js"></script>
</body>
</html>
